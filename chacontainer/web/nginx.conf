server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Local-only stack: the api service name only resolves inside the
    # docker-compose network, so this proxy never reaches the internet.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /webhooks/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://api:8080/health;
    }

    # React Router SPA fallback.
    location / {
        try_files $uri /index.html;
    }
}
